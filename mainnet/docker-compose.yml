services:
  xinfinnetwork:
    container_name: xdcnetwork-mainnet-node
    image: xinfinorg/xdposchain:v2.7.0
    volumes:
      - "./xdcchain:/work/xdcchain"
      - "./genesis.json:/work/genesis.json"
      - "./start-node.sh:/work/start.sh"
      - "./bootnodes.list:/work/bootnodes.list"
      - "./.pwd:/work/.pwd"
      - "/etc/localtime:/etc/localtime:ro"
    pull_policy: always
    restart: "always"
    env_file:
      - .env
    network_mode: "host"

  log-uploader:
    container_name: xdcnetwork-mainnet-log-uploader
    image: fluent/fluent-bit:3.2
    profiles:
      - loki-logs
    volumes:
      - "./xdcchain:/logs:ro"
      - "./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro"
      - "fluent-bit-state:/tmp"
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    restart: "always"
    depends_on:
      - xinfinnetwork

volumes:
  fluent-bit-state:
