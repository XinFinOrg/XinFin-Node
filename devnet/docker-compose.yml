services:
  devnet1:
    container_name: xdcnetwork-devnet-node
    image: anunayxin/devnet:devnetsetup-82484975c
    pull_policy: if_not_present
    volumes:
      - ./xdcchain1:/work/xdcchain
      - ./genesis.json:/work/genesis.json
      - ./bootnodes.list:/work/bootnodes.list
      - "./start-devnet.sh:/work/start.sh"
    restart: always
    env_file:
      - devnet1.env
    profiles:
      - machine1
    ports:
      - "8545:8545"
      - "8555:8555"
      - "30303:30303"
      - "30303:30303/udp"
